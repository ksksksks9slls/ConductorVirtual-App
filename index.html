<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro - Orquesta Virtual</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MediaPipe para el seguimiento de pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <style>
        @keyframes sway {
            0%, 100% { transform: rotate(-5deg) translateY(0px); }
            50% { transform: rotate(5deg) translateY(-10px); }
        }
        @keyframes erratic {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 5px) rotate(-10deg); }
            50% { transform: translate(5px, -5px) rotate(15deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-sway { animation: sway 2s infinite ease-in-out; }
        .animate-erratic { animation: erratic 0.2s infinite; }
        .curtain {
            background: linear-gradient(to bottom, #7f1d1d 0%, #450a0a 100%);
            border-bottom: 4px solid #facc15;
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans overflow-hidden">

    <!-- MENU PRINCIPAL -->
    <div id="menu" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
        <div class="w-full max-w-md p-8 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 text-center">
            <h1 class="text-5xl font-bold text-yellow-500 mb-2" style="font-family: serif;">Maestro</h1>
            <p class="text-slate-400 mb-8">Dirige tu orquesta con tus manos</p>
            
            <div class="space-y-4">
                <div class="bg-slate-700/50 p-4 rounded-xl border border-slate-600">
                    <label class="cursor-pointer block">
                        <span id="file-label" class="text-sm font-medium text-blue-400">Seleccionar música (MP3/WAV)</span>
                        <input type="file" id="audio-input" accept="audio/*" class="hidden">
                    </label>
                </div>

                <div class="flex gap-2 justify-center">
                    <button onclick="setMode('facil')" id="btn-facil" class="flex-1 py-2 rounded-lg bg-slate-700 text-slate-400 font-bold border-2 border-transparent">Fácil</button>
                    <button onclick="setMode('dificil')" id="btn-dificil" class="flex-1 py-2 rounded-lg bg-red-600 text-white font-bold border-2 border-white">Difícil</button>
                </div>

                <button onclick="startApp()" id="btn-start" disabled class="w-full py-4 bg-slate-600 text-slate-400 rounded-xl font-bold text-lg cursor-not-allowed">
                    ¡Cargar Orquesta!
                </button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE PERMISOS / CARGA -->
    <div id="loading" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-900 text-center p-6">
        <div>
            <div class="w-12 h-12 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
            <h2 id="loading-text" class="text-xl font-bold">Solicitando acceso a cámara...</h2>
            <p class="text-slate-400 mt-2">Acepta los permisos para continuar.</p>
        </div>
    </div>

    <!-- ESCENARIO DE JUEGO -->
    <div id="game" class="hidden fixed inset-0 flex flex-col">
        <div class="curtain w-full h-16 flex justify-between items-center px-6">
            <h2 class="text-yellow-500 font-bold italic">Maestro</h2>
            <button onclick="location.reload()" class="bg-red-800 px-3 py-1 rounded-lg text-xs font-bold">SALIR</button>
        </div>

        <!-- FEED CAMARA -->
        <div class="absolute top-20 right-4 z-30 w-32 h-24 bg-black rounded-lg border-2 border-slate-700 overflow-hidden shadow-2xl">
            <video id="video-input" class="hidden"></video>
            <canvas id="canvas-output" class="w-full h-full object-cover"></canvas>
        </div>

        <!-- MENSAJES FEEDBACK -->
        <div id="status-msg" class="absolute top-24 left-1/2 -translate-x-1/2 z-30 pointer-events-none transition-opacity">
            <span class="bg-red-600 text-white px-4 py-2 rounded-full font-bold shadow-lg">¡MUEVE LAS MANOS!</span>
        </div>

        <!-- ORQUESTA -->
        <div class="flex-1 flex items-end justify-center pb-20 relative">
            <div class="flex gap-6 sm:gap-12 text-7xl sm:text-9xl grayscale opacity-40 transition-all duration-500" id="musicians">
                <div style="animation-delay: 0.1s">🎻</div>
                <div style="animation-delay: 0.3s">🎺</div>
                <div style="animation-delay: 0.0s">🥁</div>
                <div style="animation-delay: 0.2s">🎹</div>
                <div style="animation-delay: 0.4s">🎻</div>
            </div>
            <div class="absolute bottom-0 w-full h-10 bg-[#2d1b11] border-t-4 border-[#3e2723]"></div>
        </div>
    </div>

    <script>
        // --- VARIABLES DE ESTADO ---
        let mode = 'dificil';
        let audioSrc = null;
        let audioCtx, audio, filter, track;
        let pose, camera;
        let prevL = null, prevR = null;
        let speed = 0;

        const menu = document.getElementById('menu');
        const loading = document.getElementById('loading');
        const game = document.getElementById('game');
        const audioInput = document.getElementById('audio-input');
        const btnStart = document.getElementById('btn-start');
        const musicians = document.getElementById('musicians');
        const statusMsg = document.getElementById('status-msg');

        // --- SELECCIÓN DE ARCHIVO Y MODO ---
        audioInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                audioSrc = URL.createObjectURL(file);
                document.getElementById('file-label').innerText = "✅ " + file.name;
                btnStart.disabled = false;
                btnStart.classList.replace('bg-slate-600', 'bg-yellow-500');
                btnStart.classList.replace('text-slate-400', 'text-slate-900');
                btnStart.classList.remove('cursor-not-allowed');
            }
        };

        function setMode(m) {
            mode = m;
            document.getElementById('btn-facil').className = m === 'facil' ? 'flex-1 py-2 rounded-lg bg-green-600 text-white font-bold border-2 border-white' : 'flex-1 py-2 rounded-lg bg-slate-700 text-slate-400 font-bold border-2 border-transparent';
            document.getElementById('btn-dificil').className = m === 'dificil' ? 'flex-1 py-2 rounded-lg bg-red-600 text-white font-bold border-2 border-white' : 'flex-1 py-2 rounded-lg bg-slate-700 text-slate-400 font-bold border-2 border-transparent';
        }

        // --- INICIO DE APLICACIÓN ---
        async function startApp() {
            menu.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                // 1. Permisos Cámara
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(t => t.stop());

                // 2. Setup Audio
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                audio = new Audio(audioSrc);
                audio.loop = true;
                audio.preservesPitch = false; // Permite distorsión rítmica
                track = audioCtx.createMediaElementSource(audio);
                filter = audioCtx.createBiquadFilter();
                filter.type = 'lowshelf';
                track.connect(filter).connect(audioCtx.destination);

                // 3. Setup AI Pose
                pose = new Pose({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
                });
                pose.setOptions({ modelComplexity: 0, minDetectionConfidence: 0.5 });
                pose.onResults(onPoseResults);

                camera = new Camera(document.getElementById('video-input'), {
                    onFrame: async () => { await pose.send({ image: document.getElementById('video-input') }); },
                    width: 320, height: 240
                });

                await camera.start();
                loading.classList.add('hidden');
                game.classList.remove('hidden');
                
                if(mode === 'facil') audio.play();

            } catch (err) {
                alert("Error: " + err.message);
                location.reload();
            }
        }

        // --- LÓGICA DE DETECCIÓN Y AUDIO ---
        function onPoseResults(results) {
            const canvas = document.getElementById('canvas-output');
            const ctx = canvas.getContext('2d');
            ctx.save();
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            
            let rawSpeed = 0;
            if (results.poseLandmarks) {
                const l = results.poseLandmarks[15];
                const r = results.poseLandmarks[16];
                if (prevL && prevR) {
                    rawSpeed = (Math.hypot(l.x - prevL.x, l.y - prevL.y) + Math.hypot(r.x - prevR.x, r.y - prevR.y)) / 2;
                }
                prevL = l; prevR = r;

                // Dibujar puntos
                ctx.fillStyle = "yellow";
                [l, r].forEach(p => { ctx.beginPath(); ctx.arc(p.x*canvas.width, p.y*canvas.height, 5, 0, 7); ctx.fill(); });
            }
            ctx.restore();

            speed = speed * 0.8 + rawSpeed * 0.2;
            updateGame(speed);
        }

        function updateGame(s) {
            if (mode === 'facil') {
                musicians.classList.remove('grayscale', 'opacity-40');
                musicians.classList.add('animate-sway');
                statusMsg.style.opacity = 0;
                return;
            }

            // Modo difícil
            if (s < 0.003) { // Pausa
                if(!audio.paused) audio.pause();
                musicians.classList.add('grayscale', 'opacity-40');
                musicians.classList.remove('animate-sway', 'animate-erratic');
                statusMsg.style.opacity = 1;
            } else if (s > 0.06) { // Errático
                if(audio.paused) audio.play();
                audio.playbackRate = 1.4;
                filter.gain.value = 25;
                musicians.classList.remove('grayscale', 'opacity-40', 'animate-sway');
                musicians.classList.add('animate-erratic');
                statusMsg.style.opacity = 0;
            } else { // Normal
                if(audio.paused) audio.play();
                audio.playbackRate = Math.min(Math.max(0.8 + (s*10), 0.8), 1.2);
                filter.gain.value = 0;
                musicians.classList.remove('grayscale', 'opacity-40', 'animate-erratic');
                musicians.classList.add('animate-sway');
                statusMsg.style.opacity = 0;
            }
        }
    </script>
</body>
</html>
