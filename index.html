<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MAESTRO | Experiencia Rítmica Inmersiva</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

    <style>
        /* --- ESTILOS MODERNOS & RESPONSIVE (CSS) --- */
        :root {
            --primary: #FFD700; /* Gold */
            --accent: #00E5FF; /* Cyan */
            --bg-dark: #050505;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-hover: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #888888;
            --error: #FF4444;
            --success: #44FF44;
            --font-display: 'Helvetica Neue', sans-serif;
            --font-serif: 'Georgia', serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-display);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* --- CAPAS DE LA APLICACIÓN --- */
        .layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }

        /* --- FONDO ANIMADO --- */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 0;
            opacity: 0.3;
        }

        /* --- UI ELEMENTS --- */
        h1 {
            font-family: var(--font-serif);
            font-size: clamp(3rem, 8vw, 6rem);
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(255, 215, 0, 0.2);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text-dim);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        .btn {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 18px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 10px;
            width: min(300px, 80vw);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--surface-hover);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* --- PANTALLAS ESPECÍFICAS --- */
        
        /* Loading */
        #loader-screen {
            background: var(--bg-dark);
            z-index: 100;
        }
        .spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Menu */
        #menu-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }

        /* HUD JUEGO */
        #game-ui {
            justify-content: space-between;
            pointer-events: none; /* Dejar pasar clicks al canvas */
            padding: 20px;
        }
        
        #score-panel {
            text-align: right;
            position: absolute;
            top: 20px; right: 20px;
        }
        
        .score-big {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        #feedback-area {
            position: absolute;
            top: 30%;
            width: 100%;
            text-align: center;
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            opacity: 0;
            transform: scale(0.5);
            transition: transform 0.1s;
        }

        #tap-prompt {
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            text-align: center;
            pointer-events: auto;
            cursor: pointer;
            animation: pulse 2s infinite;
        }

        /* ERROR MODAL */
        #error-modal {
            background: rgba(0,0,0,0.95);
            z-index: 200;
            padding: 40px;
            text-align: center;
        }
        .error-icon { font-size: 4rem; margin-bottom: 20px; color: var(--error); }
        .error-title { font-size: 2rem; color: white; margin-bottom: 10px; }
        .error-desc { color: #aaa; margin-bottom: 30px; line-height: 1.6; }

        /* Video Input (Invisible but active) */
        #input_video {
            display: none;
            transform: scaleX(-1);
        }

        /* Canvas Juego */
        #game-canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            touch-action: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); } }
    </style>
</head>
<body>

    <video id="input_video"></video>

    <canvas id="bg-canvas"></canvas>

    <canvas id="game-canvas"></canvas>

    <div id="loader-screen" class="layer">
        <div class="spinner"></div>
        <p style="margin-top:20px; color: var(--text-dim);">Inicializando MAESTRO...</p>
    </div>

    <div id="landing-screen" class="layer hidden">
        <h1>MAESTRO</h1>
        <h2>Dirige la orquesta</h2>
        <div style="margin-top: 50px;">
            <button class="btn" onclick="App.goToMenu()">Comenzar</button>
        </div>
    </div>

    <div id="menu-screen" class="layer hidden">
        <h1 style="font-size: 3rem;">MENÚ</h1>
        <div id="menu-options">
            <button class="btn" onclick="App.startGame('maestro')">Modo Maestro (Cámara)</button>
            <button class="btn" onclick="App.startGame('practice')">Modo Práctica (Cámara)</button>
            <button class="btn" onclick="App.startGame('touch')">Modo Sin Cámara</button>
            <button class="btn" onclick="alert('Versión 1.0.0\nDesarrollado para demostración.')">Ajustes</button>
        </div>
    </div>

    <div id="game-ui" class="layer hidden">
        <div id="score-panel">
            <div style="font-size: 0.8rem; text-transform:uppercase; color:#888;">Puntuación</div>
            <div id="score-display" class="score-big">0</div>
            <div id="combo-display" style="color: var(--accent);">Racha: 0</div>
        </div>

        <div id="feedback-area"></div>

        <div id="tap-prompt" class="hidden">
            <h3 style="margin:0; color:var(--primary);">PREPARADO</h3>
            <p>Da <strong>3 toques</strong> para iniciar la orquesta</p>
            <div id="tap-count" style="font-size:2rem; margin-top:10px;">• • •</div>
        </div>

        <button onclick="App.goToMenu()" style="position: absolute; bottom: 20px; left: 20px; background:transparent; border:none; color:white; opacity:0.5; cursor:pointer;">✖ Salir</button>
    </div>

    <div id="error-modal" class="layer hidden">
        <div class="error-icon">⚠</div>
        <div class="error-title" id="err-title">Error</div>
        <div class="error-desc" id="err-desc">Descripción del error.</div>
        <button class="btn" onclick="location.reload()">Reiniciar App</button>
    </div>

    <script>
        /**
         * MAESTRO - Core Application Logic
         * Designed for High Performance and Modularity
         */

        // --- CONFIGURACIÓN GLOBAL ---
        const CONFIG = {
            songUrl: 'https://upload.wikimedia.org/wikipedia/commons/4/46/Grieg_In_the_Hall_of_the_Mountain_King_-_Sinfonia_Leipzig.ogg', // Peer Gynt (Dominio Público)
            bpm: 110, // BPM aproximado para generar notas
            hitZoneY: 0.85, // Posición vertical de la zona de impacto (0 a 1)
            audioLatency: 0.1,
            colors: {
                left: '#00E5FF',  // Cyan
                right: '#FF00E5', // Magenta
                hit: '#FFD700',   // Gold
                miss: '#FF4444'   // Red
            }
        };

        // --- GESTIÓN DE AUDIO (Web Audio API) ---
        const AudioSys = {
            ctx: null,
            buffer: null,
            source: null,
            gainNode: null,
            filterNode: null, // Lowpass filter para simular "muffled sound"
            isLoaded: false,

            init: async function() {
                try {
                    window.AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    const response = await fetch(CONFIG.songUrl);
                    if(!response.ok) throw new Error("No se pudo descargar la música");
                    
                    const arrayBuffer = await response.arrayBuffer();
                    this.buffer = await this.ctx.decodeAudioData(arrayBuffer);
                    this.isLoaded = true;
                    console.log("Audio Sistema: Listo");
                } catch (e) {
                    ErrorHandler.show("Error de Audio", "No se pudo cargar la pieza musical. Verifique su conexión.", "Asegúrese de tener internet activo.");
                }
            },

            play: function() {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                this.source = this.ctx.createBufferSource();
                this.source.buffer = this.buffer;

                // Cadena de efectos: Source -> Filter -> Gain -> Destination
                this.filterNode = this.ctx.createBiquadFilter();
                this.filterNode.type = 'lowpass';
                this.filterNode.frequency.value = 20000; // Abierto totalmente al inicio

                this.gainNode = this.ctx.createGain();
                this.gainNode.gain.value = 1.0;

                this.source.connect(this.filterNode);
                this.filterNode.connect(this.gainNode);
                this.gainNode.connect(this.ctx.destination);

                this.source.start(0);
                this.source.onended = () => App.endGame();
            },

            stop: function() {
                if (this.source) {
                    try { this.source.stop(); } catch(e){}
                }
            },

            // Efecto dinámico: Si fallas, la música se "apaga" (filtro pasa bajos)
            setQuality: function(quality) { // 0.0 a 1.0
                if (!this.filterNode) return;
                const freq = 200 + (19800 * quality); // Mínimo 200Hz, Máximo 20kHz
                this.filterNode.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.2);
            }
        };

        // --- MOTOR DE ENTRADA (Cámara y Touch) ---
        const InputSys = {
            mode: null, // 'maestro', 'practice', 'touch'
            pose: null,
            camera: null,
            hands: { 
                left: { x: 0, y: 0, active: false }, 
                right: { x: 0, y: 0, active: false } 
            },

            init: async function(mode) {
                this.mode = mode;
                
                if (mode === 'touch') {
                    // Configurar listeners de touch
                    window.addEventListener('touchstart', this.handleTouch, {passive: false});
                    window.addEventListener('mousedown', this.handleMouse); // Para debug en PC
                    return true;
                } 
                
                // Modos de cámara
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error("API de cámara no soportada");
                }

                document.getElementById('loader-screen').classList.remove('hidden');
                
                this.pose = new Pose({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                }});

                this.pose.setOptions({
                    modelComplexity: 1,
                    smoothLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                this.pose.onResults(this.onPoseResults);

                const videoElement = document.getElementById('input_video');
                
                this.camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await this.pose.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });

                await this.camera.start();
                document.getElementById('loader-screen').classList.add('hidden');
                return true;
            },

            stop: function() {
                if (this.camera) this.camera.stop();
                window.removeEventListener('touchstart', this.handleTouch);
                window.removeEventListener('mousedown', this.handleMouse);
            },

            onPoseResults: function(results) {
                if (!results.poseLandmarks) return;

                // Landmarks: 15 (Muñeca Izq), 16 (Muñeca Der)
                // Invertimos X porque la cámara es espejo
                InputSys.hands.left.x = (1 - results.poseLandmarks[15].x) * window.innerWidth;
                InputSys.hands.left.y = results.poseLandmarks[15].y * window.innerHeight;
                
                InputSys.hands.right.x = (1 - results.poseLandmarks[16].x) * window.innerWidth;
                InputSys.hands.right.y = results.poseLandmarks[16].y * window.innerHeight;

                // Trigger lógica de juego si entra en zona
                Game.checkInput(InputSys.hands.left, 'left');
                Game.checkInput(InputSys.hands.right, 'right');
            },

            handleTouch: function(e) {
                e.preventDefault();
                for (let i = 0; i < e.touches.length; i++) {
                    const t = e.touches[i];
                    InputSys.processTap(t.clientX, t.clientY);
                }
            },

            handleMouse: function(e) {
                InputSys.processTap(e.clientX, e.clientY);
            },

            processTap: function(x, y) {
                // Efecto visual de toque
                RenderSys.createRipple(x, y);
                
                const mid = window.innerWidth / 2;
                const side = x < mid ? 'left' : 'right';
                
                // Simular posición de mano en zona de impacto
                const targetY = window.innerHeight * CONFIG.hitZoneY;
                const targetX = side === 'left' ? mid / 2 : mid + (mid / 2);

                Game.checkInput({x: targetX, y: targetY}, side, true); // true = force hit check
            }
        };

        // --- LÓGICA DEL JUEGO ---
        const Game = {
            active: false,
            score: 0,
            combo: 0,
            health: 1.0, // Calidad de audio
            notes: [],
            lastTime: 0,
            tapCounter: 0,

            setup: function() {
                this.score = 0;
                this.combo = 0;
                this.health = 1.0;
                this.notes = [];
                this.active = false;
                this.tapCounter = 0;
                
                // Mostrar UI de inicio
                const prompt = document.getElementById('tap-prompt');
                prompt.classList.remove('hidden');
                document.getElementById('tap-count').innerHTML = "⚪ ⚪ ⚪";
                
                // Listener global para los 3 toques
                const handler = (e) => {
                    this.tapCounter++;
                    let dots = "";
                    for(let i=0; i<3; i++) dots += i < this.tapCounter ? "🟡 " : "⚪ ";
                    document.getElementById('tap-count').innerHTML = dots;

                    if (this.tapCounter >= 3) {
                        window.removeEventListener('pointerdown', handler);
                        prompt.classList.add('hidden');
                        this.start();
                    }
                };
                window.addEventListener('pointerdown', handler);
            },

            start: function() {
                this.active = true;
                this.lastTime = performance.now();
                AudioSys.play();
                this.spawnLoop();
                this.loop();
            },

            spawnLoop: function() {
                if (!this.active) return;
                
                // Generar nota basada en BPM
                const delay = 60000 / CONFIG.bpm; 
                
                // Patrón aleatorio simple
                if (Math.random() > 0.3) {
                    const side = Math.random() > 0.5 ? 'left' : 'right';
                    this.notes.push({
                        side: side,
                        y: -100, // Arriba de la pantalla
                        hit: false,
                        missed: false,
                        color: side === 'left' ? CONFIG.colors.left : CONFIG.colors.right
                    });
                }
                
                // A veces doble nota
                if (Math.random() > 0.9) {
                     this.notes.push({
                        side: 'right', // Forzar la otra si sale doble
                        y: -100,
                        hit: false,
                        missed: false,
                        color: CONFIG.colors.right
                    });
                }

                setTimeout(() => this.spawnLoop(), delay);
            },

            loop: function() {
                if (!this.active) return;
                
                const now = performance.now();
                const dt = (now - this.lastTime) / 1000;
                this.lastTime = now;

                // Mover notas (Velocidad adaptada a altura de pantalla)
                const speed = window.innerHeight * 0.6; // 60% de altura por segundo
                const hitY = window.innerHeight * CONFIG.hitZoneY;

                this.notes.forEach(note => {
                    if (note.hit || note.missed) return;

                    note.y += speed * dt;

                    // Detectar Miss
                    if (note.y > window.innerHeight + 50) {
                        note.missed = true;
                        this.handleMiss();
                    }
                });

                // Limpieza
